<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password · Defense Queue</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/reset-password.js"></script>
</head>
<body>
  <main class="auth">
    <div class="auth-top">
      <h1>Defense Queue</h1>
      <button type="button" id="theme" class="btn ghost">Dark</button>
    </div>
    <p id="reset-wait" class="muted center">Checking the link...</p>
    <p id="reset-bad" class="notice" hidden>This link is invalid or expired. <a href="login.html#forgot">Ask for a new one</a>.</p>
    <form id="reset-form" class="card form" novalidate hidden>
      <h2>New password</h2>
      <label>New password
        <input name="password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>Repeat password
        <input name="password2" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button type="submit" class="btn primary block">Save</button>
    </form>
  </main>
</body>
</html>
